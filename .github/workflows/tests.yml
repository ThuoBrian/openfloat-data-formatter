name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python environment
        run: uv sync --python 3.12

      - name: Lint
        run: uv run ruff check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python environment
        run: uv sync --python 3.12

      - name: Type-check
        run: uv run mypy

  pytest:
    name: pytest (${{ matrix.os }})
    # The end-user base is Windows, so the suite runs on both — a Windows-only
    # failure (paths, file handling) must not ship.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python environment
        run: uv sync --python 3.12

      - name: Run test suite
        run: uv run pytest -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Staff install from GitHub's zip and never run Node, so the built page
      # and the generated API types are committed. Rebuild both and fail on
      # any difference: a stale bundle would ship the old page to everyone.
      - name: Generated API types match docs/openapi.json
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts

      - name: Committed build matches the source
        run: |
          npm run build
          git status --porcelain -- ../src/openfloat_formatter/web
          test -z "$(git status --porcelain -- ../src/openfloat_formatter/web)"
