[project]
name = "openfloat-data-formatter"
version = "0.1.0"
description = "Transform Process Maker airtime disbursement exports into the OpenFloat SaaS upload template format."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "streamlit>=1.29.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The import package name differs from the distribution name, so declare it.
packages = ["src/openfloat_formatter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
