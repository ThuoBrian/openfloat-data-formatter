[project]
name = "openfloat-data-formatter"
version = "0.1.0"
description = "Transform Process Maker airtime disbursement exports into the OpenFloat SaaS upload template format."
readme = "README.md"
license = { text = "Proprietary — all rights reserved. Internal use only." }
authors = [{ name = "Brian Thuo" }]
requires-python = ">=3.11"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "streamlit>=1.29.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ThuoBrian/openfloat-data-formatter"
Repository = "https://github.com/ThuoBrian/openfloat-data-formatter"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The import package name differs from the distribution name, so declare it.
packages = ["src/openfloat_formatter"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import order)
    "UP",  # pyupgrade (modernize syntax)
    "B",   # bugbear (likely bugs/design smells)
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific rules
]
allowed-confusables = ["×"]

[tool.ruff.lint.isort]
known-first-party = ["openfloat_formatter"]

[tool.mypy]
files = ["src", "tests"]
# The dev/CI environment is Python 3.12 (uv sync --python 3.12); modern numpy
# stubs use 3.12-only syntax and fail to parse under older targets.
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
